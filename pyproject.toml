[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconocedor-de-caras"
version = "0.1.0"
description = "Reconocimiento facial local en tiempo real con OpenCV, SFace y SQLite"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<5",
]

[project.scripts]
faceguard = "faceguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


