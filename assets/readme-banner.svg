<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">FRG-05 — FaceGuard recovered artifact</title>
  <desc id="desc">Portada monocromática estilo manga y fotocopia para el reconocedor facial</desc>
  <defs>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".12"/></pattern>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1200" height="1" fill="#fff" opacity=".045"/></pattern>
    <filter id="rough"><feTurbulence baseFrequency=".8" numOctaves="3" seed="7" result="noise"/><feComposite in="noise" in2="SourceGraphic" operator="in" result="texture"/><feBlend in="SourceGraphic" in2="texture" mode="screen"/></filter>
  </defs>
  <rect width="1200" height="420" fill="#070707"/><rect width="1200" height="420" fill="url(#dots)"/><rect width="1200" height="420" fill="url(#lines)"/>
  <g transform="translate(56 42)" fill="none" stroke="#f3f3f3">
    <rect width="310" height="330" stroke-width="2" opacity=".82"/><path d="M0 38h310M34 0v330M276 0v330" opacity=".22"/>
    <path d="M17 64V17h47M293 64V17h-47M17 266v47h47M293 266v47h-47" stroke-width="5"/>
    <ellipse cx="155" cy="138" rx="65" ry="84" stroke-width="3" filter="url(#rough)"/><path d="M83 307c7-73 32-106 72-106 41 0 66 33 73 106" stroke-width="3" filter="url(#rough)"/>
    <path d="M113 125h27m29 0h27m-54 39h25m-40 21c20 13 39 13 57 0" stroke-width="3" opacity=".7"/><path d="M8 88h74m145 0h75M8 154h67m160 0h67M8 221h82m130 0h82" opacity=".22"/>
  </g>
  <g transform="translate(418 64)" font-family="Consolas, Menlo, monospace">
    <text x="0" y="0" fill="#777" font-size="17" letter-spacing="4">RECOVERED ARTIFACT // NODE 005</text>
    <text x="0" y="80" fill="#f5f5f5" font-family="Arial Black, Impact, sans-serif" font-size="76" letter-spacing="4">FACEGUARD</text>
    <rect x="0" y="102" width="690" height="4" fill="#eee"/><text x="0" y="146" fill="#bdbdbd" font-size="21">LOCAL FACE RECOGNITION / AFTER HOURS</text><text x="0" y="192" fill="#777" font-size="16">YUNET  //  SFACE  //  SQLITE  //  RTSP</text>
    <g transform="translate(0 228)"><rect width="230" height="48" fill="#eee"/><text x="18" y="31" fill="#090909" font-size="16" font-weight="700">IDENTITY: UNKNOWN</text><rect x="246" width="195" height="48" fill="none" stroke="#888"/><text x="264" y="31" fill="#ddd" font-size="16">STATUS: WATCHING</text></g>
    <text x="0" y="320" fill="#f3f3f3" font-size="15" letter-spacing="2">THE CAMERA NEVER BLINKED. THE CLOUD NEVER KNEW.</text>
  </g>
  <g opacity=".7"><rect x="0" y="174" width="1200" height="5" fill="#fff"><animate attributeName="opacity" values="0;.75;0" dur="3.7s" repeatCount="indefinite"/></rect><rect x="670" y="55" width="430" height="9" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0;.55;0;0" dur="4.1s" repeatCount="indefinite"/></rect><rect x="420" y="331" width="570" height="4" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;.35;0;0" dur="2.9s" repeatCount="indefinite"/></rect></g>
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#aaa" stroke-width="2"/>
</svg>

