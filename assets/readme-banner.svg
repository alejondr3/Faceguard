<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FaceGuard - Reconocimiento facial local</title>
  <desc id="desc">Banner cyberpunk con un rostro escaneado y marcos de detección</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#071b1d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#62ff8f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27e8d8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" fill="#8affdc" opacity=".05"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#scan)"/>
  <path d="M0 286 C270 245 430 340 710 292 S1010 230 1200 272 V360 H0Z" fill="#00ffb3" opacity=".035"/>

  <g transform="translate(72 42)" fill="none" stroke="url(#neon)" filter="url(#glow)">
    <path d="M0 48V0h48 M218 0h48v48 M266 218v48h-48 M48 266H0v-48" stroke-width="5"/>
    <ellipse cx="133" cy="113" rx="58" ry="73" stroke-width="3" opacity=".9"/>
    <path d="M72 256c6-54 29-81 61-81s56 27 62 81" stroke-width="3" opacity=".9"/>
    <path d="M93 103h26m28 0h26m-50 35h20m-34 19c17 12 34 12 50 0" stroke-width="3" opacity=".72"/>
    <path d="M42 82h31m120 0h31M42 129h35m112 0h35M42 177h40m102 0h40" stroke-width="1.5" opacity=".45"/>
  </g>

  <g transform="translate(414 82)">
    <text x="0" y="42" fill="#8fffee" font-family="Consolas, Menlo, monospace" font-size="18" letter-spacing="5">LOCAL BIOMETRIC ENGINE // ONLINE</text>
    <text x="0" y="112" fill="url(#neon)" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="2">FACEGUARD</text>
    <text x="2" y="157" fill="#c9d6f2" font-family="Segoe UI, Arial, sans-serif" font-size="24">Reconocimiento facial en tiempo real · SQLite · RTSP · Video</text>
    <g transform="translate(2 195)" font-family="Consolas, Menlo, monospace" font-size="15">
      <rect width="198" height="34" rx="17" fill="#00e9ff" opacity=".12" stroke="#00e9ff"/>
      <text x="19" y="23" fill="#6ef6ff">◆ PRIVACY-FIRST</text>
      <rect x="214" width="198" height="34" rx="17" fill="#55ff8c" opacity=".10" stroke="#55ff8c"/>
      <text x="233" y="23" fill="#89ffac">◆ FULLY LOCAL</text>
    </g>
  </g>

  <circle cx="1138" cy="54" r="5" fill="#62ff8f" filter="url(#glow)"/>
  <circle cx="1138" cy="54" r="11" fill="none" stroke="#62ff8f" opacity=".6">
    <animate attributeName="r" values="6;18;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1100" y="91" fill="#62ff8f" font-family="Consolas, monospace" font-size="13">SECURE</text>
  <rect x="0" y="0" width="1200" height="3" fill="#7fffe7" opacity=".28">
    <animate attributeName="y" values="8;350;8" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.35;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#44ffe1" stroke-opacity=".28" stroke-width="2"/>
</svg>

